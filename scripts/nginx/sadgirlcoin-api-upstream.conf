# /etc/nginx/conf.d/sadgirlcoin-api-upstream.conf
#
# HTTP-context directives for the SadGirlCoin API reverse proxy.
# This file is auto-loaded by the `include /etc/nginx/conf.d/*.conf;` line
# in the default nginx.conf, so it lands in the `http {}` block where these
# directives are required.
#
# The matching `location /v1/` block lives in:
#   /etc/nginx/snippets/sadgirlcoin-api.conf
# and must be included from inside your `server { ... }` block.

upstream sgc_api_backend {
    server 127.0.0.1:7788;
    keepalive 16;
}

# Per-IP safety net in front of the app's per-app rate limit.
limit_req_zone $binary_remote_addr zone=sgc_api_ip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=sgc_oauth_ip:10m rate=5r/s;

# Allow-list of HTTP methods the API actually uses.
map $request_method $sgc_api_method_ok {
    default  0;
    GET      1;
    POST     1;
    DELETE   1;
    OPTIONS  1;
}
