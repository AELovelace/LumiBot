# /etc/nginx/sites-available/sadgirlsclub.wtf.conf
#
# Full nginx site file for sadgirlsclub.wtf.
# Assumptions:
# - Certbot/Let's Encrypt certs live at:
#     /etc/letsencrypt/live/sadgirlsclub.wtf/fullchain.pem
#     /etc/letsencrypt/live/sadgirlsclub.wtf/privkey.pem
# - LumiBot web panel listens on 10.1.1.23:7777
# - SGCServer public API/OAuth listens on 10.1.1.23:7788
#
# This file is meant to be symlinked into /etc/nginx/sites-enabled/.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=sgc_oauth_ip:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name sadgirlsclub.wtf www.sadgirlsclub.wtf;

    return 301 https://sadgirlsclub.wtf$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sadgirlsclub.wtf www.sadgirlsclub.wtf;

    ssl_certificate     /etc/letsencrypt/live/sadgirlsclub.wtf/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sadgirlsclub.wtf/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SadGirlsClubSSL:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 16k;

    location = /v1 {
        return 301 /v1/;
    }

    location = /oauth {
        return 301 /oauth/;
    }

    location = /v1/healthz {
        proxy_pass         http://10.1.1.23:7788;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Host  $host;
        access_log         off;
        add_header         Cache-Control "no-store" always;
    }

    location /auth/ {
        proxy_pass                 http://10.1.1.23:7777;
        proxy_http_version         1.1;
        proxy_set_header           Connection            "";
        proxy_set_header           Host                  $host;
        proxy_set_header           X-Forwarded-For       $proxy_add_x_forwarded_for;
        proxy_set_header           X-Forwarded-Proto     $scheme;
        proxy_set_header           X-Real-IP             $remote_addr;
        proxy_set_header           X-Forwarded-Host      $host;
        proxy_pass_request_headers on;
        proxy_intercept_errors     off;
        proxy_connect_timeout      5s;
        proxy_send_timeout         30s;
        proxy_read_timeout         30s;
        proxy_buffering            off;
        proxy_request_buffering    on;
        proxy_hide_header          Server;
        add_header                 Cache-Control "no-store" always;
    }

    location = /oauth/consent {
        proxy_pass                 http://10.1.1.23:7777;
        proxy_http_version         1.1;
        proxy_set_header           Connection            "";
        proxy_set_header           Host                  $host;
        proxy_set_header           X-Forwarded-For       $proxy_add_x_forwarded_for;
        proxy_set_header           X-Forwarded-Proto     $scheme;
        proxy_set_header           X-Real-IP             $remote_addr;
        proxy_set_header           X-Forwarded-Host      $host;
        proxy_pass_request_headers on;
        proxy_intercept_errors     off;
        proxy_connect_timeout      5s;
        proxy_send_timeout         30s;
        proxy_read_timeout         30s;
        proxy_buffering            off;
        proxy_request_buffering    on;
        proxy_hide_header          Server;
        add_header                 Cache-Control "no-store" always;
    }

    location /oauth/ {
        limit_req                  zone=sgc_oauth_ip burst=20 nodelay;

        proxy_pass                 http://10.1.1.23:7788;
        proxy_http_version         1.1;
        proxy_set_header           Connection            "";
        proxy_set_header           Host                  $host;
        proxy_set_header           X-Forwarded-For       $proxy_add_x_forwarded_for;
        proxy_set_header           X-Forwarded-Proto     $scheme;
        proxy_set_header           X-Real-IP             $remote_addr;
        proxy_set_header           X-Forwarded-Host      $host;
        proxy_pass_request_headers on;
        proxy_intercept_errors     off;
        proxy_connect_timeout      5s;
        proxy_send_timeout         30s;
        proxy_read_timeout         30s;
        proxy_buffering            off;
        proxy_request_buffering    on;
        proxy_hide_header          Server;
        add_header                 Cache-Control "no-store" always;
    }

    location /v1/ {
        proxy_pass                 http://10.1.1.23:7788;
        proxy_http_version         1.1;
        proxy_set_header           Connection            "";
        proxy_set_header           Host                  $host;
        proxy_set_header           X-Forwarded-For       $proxy_add_x_forwarded_for;
        proxy_set_header           X-Forwarded-Proto     $scheme;
        proxy_set_header           X-Real-IP             $remote_addr;
        proxy_set_header           X-Forwarded-Host      $host;
        proxy_pass_request_headers on;
        proxy_intercept_errors     off;
        proxy_connect_timeout      5s;
        proxy_send_timeout         30s;
        proxy_read_timeout         30s;
        proxy_buffering            off;
        proxy_request_buffering    on;
        proxy_hide_header          Server;
        add_header                 Cache-Control "no-store" always;
    }

    # Main site/app.
    # Replace this with your real site upstream or static root if needed.
    location / {
        proxy_pass                 http://127.0.0.1:3000;
        proxy_http_version         1.1;
        proxy_set_header           Upgrade               $http_upgrade;
        proxy_set_header           Connection            $connection_upgrade;
        proxy_set_header           Host                  $host;
        proxy_set_header           X-Forwarded-For       $proxy_add_x_forwarded_for;
        proxy_set_header           X-Forwarded-Proto     $scheme;
        proxy_set_header           X-Real-IP             $remote_addr;
        proxy_set_header           X-Forwarded-Host      $host;
        proxy_connect_timeout      5s;
        proxy_send_timeout         30s;
        proxy_read_timeout         30s;
        proxy_buffering            off;
        proxy_hide_header          Server;
    }
}
