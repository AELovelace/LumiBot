# /etc/nginx/sites-available/sadgirlsclub.wtf.conf
#
# Full nginx site file for sadgirlsclub.wtf.
# Assumptions:
# - Certbot/Let's Encrypt certs live at:
#     /etc/letsencrypt/live/sadgirlsclub.wtf/fullchain.pem
#     /etc/letsencrypt/live/sadgirlsclub.wtf/privkey.pem
# - LumiBot web panel listens on 10.1.1.23:7777
# - SGCServer public API/OAuth listens on 10.1.1.23:7788
#
# This file is meant to be symlinked into /etc/nginx/sites-enabled/.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=sgc_oauth_ip:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name sadgirlsclub.wtf www.sadgirlsclub.wtf;

    return 301 https://sadgirlsclub.wtf$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sadgirlsclub.wtf www.sadgirlsclub.wtf;

    ssl_certificate     /etc/letsencrypt/live/sadgirlsclub.wtf/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sadgirlsclub.wtf/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SadGirlsClubSSL:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 16k;

    location = /v1 {
        return 301 /v1/;
    }

    location = /oauth {
        return 301 /oauth/;
    }

    location = /v1/healthz {
        proxy_pass         http://10.1.1.23:7788;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Host  $host;
        access_log         off;
        add_header         Cache-Control "no-store" always;
    }

    location /auth/ {
        proxy_pass                 http://10.1.1.23:7777;
        proxy_http_version         1.1;
        proxy_set_header           Connection            "";
        proxy_set_header           Host                  $host;
        proxy_set_header           X-Forwarded-For       $proxy_add_x_forwarded_for;
        proxy_set_header           X-Forwarded-Proto     $scheme;
        proxy_set_header           X-Real-IP             $remote_addr;
        proxy_set_header           X-Forwarded-Host      $host;
        proxy_pass_request_headers on;
        proxy_intercept_errors     off;
        proxy_connect_timeout      5s;
        proxy_send_timeout         30s;
        proxy_read_timeout         30s;
        proxy_buffering            off;
        proxy_request_buffering    on;
        proxy_hide_header          Server;
        add_header                 Cache-Control "no-store" always;
    }

    location = /oauth/consent {
        proxy_pass                 http://10.1.1.23:7777;
        proxy_http_version         1.1;
        proxy_set_header           Connection            "";
        proxy_set_header           Host                  $host;
        proxy_set_header           X-Forwarded-For       $proxy_add_x_forwarded_for;
        proxy_set_header           X-Forwarded-Proto     $scheme;
        proxy_set_header           X-Real-IP             $remote_addr;
        proxy_set_header           X-Forwarded-Host      $host;
        proxy_pass_request_headers on;
        proxy_intercept_errors     off;
        proxy_connect_timeout      5s;
        proxy_send_timeout         30s;
        proxy_read_timeout         30s;
        proxy_buffering            off;
        proxy_request_buffering    on;
        proxy_hide_header          Server;
        add_header                 Cache-Control "no-store" always;
    }

    location /oauth/ {
        limit_req                  zone=sgc_oauth_ip burst=20 nodelay;

        proxy_pass                 http://10.1.1.23:7788;
        proxy_http_version         1.1;
        proxy_set_header           Connection            "";
        proxy_set_header           Host                  $host;
        proxy_set_header           X-Forwarded-For       $proxy_add_x_forwarded_for;
        proxy_set_header           X-Forwarded-Proto     $scheme;
        proxy_set_header           X-Real-IP             $remote_addr;
        proxy_set_header           X-Forwarded-Host      $host;
        proxy_pass_request_headers on;
        proxy_intercept_errors     off;
        proxy_connect_timeout      5s;
        proxy_send_timeout         30s;
        proxy_read_timeout         30s;
        proxy_buffering            off;
        proxy_request_buffering    on;
        proxy_hide_header          Server;
        add_header                 Cache-Control "no-store" always;
    }

    location /v1/ {
        proxy_pass                 http://10.1.1.23:7788;
        proxy_http_version         1.1;
        proxy_set_header           Connection            "";
        proxy_set_header           Host                  $host;
        proxy_set_header           X-Forwarded-For       $proxy_add_x_forwarded_for;
        proxy_set_header           X-Forwarded-Proto     $scheme;
        proxy_set_header           X-Real-IP             $remote_addr;
        proxy_set_header           X-Forwarded-Host      $host;
        proxy_pass_request_headers on;
        proxy_intercept_errors     off;
        proxy_connect_timeout      5s;
        proxy_send_timeout         30s;
        proxy_read_timeout         30s;
        proxy_buffering            off;
        proxy_request_buffering    on;
        proxy_hide_header          Server;
        add_header                 Cache-Control "no-store" always;
    }

    # Lumi Web (member app, src/webAppServer.js on doll-chan :7171). Mirrors the live site-chan config (2026-11-19).
    location = /lumibot {
        return 301 /lumibot/;                                            # add the trailing slash
    }

    location /lumibot/ {
        proxy_pass                 http://10.1.1.23:7171;               # doll-chan, Lumi Web
        proxy_http_version         1.1;
        proxy_set_header           Upgrade               $http_upgrade;         # websocket upgrade
        proxy_set_header           Connection            $connection_upgrade;   # "upgrade" or "close"
        proxy_set_header           Host                  $host;
        proxy_set_header           X-Forwarded-For       $proxy_add_x_forwarded_for;
        proxy_set_header           X-Forwarded-Proto     $scheme;
        proxy_set_header           X-Real-IP             $remote_addr;  # the bot trusts this only from WEB_TRUSTED_PROXY_IPS
        proxy_set_header           X-Forwarded-Host      $host;
        proxy_connect_timeout      5s;
        proxy_send_timeout         30s;
        proxy_read_timeout         30s;
        proxy_buffering            off;
        proxy_request_buffering    on;
        proxy_hide_header          Server;
        add_header                 Cache-Control "no-store" always;
    }

    # Lumi Games (src/gameWebServer.js on doll-chan :7172, GAME_WEB_BASE_PATH=/games).
    location = /games {
        return 301 /games/;                                              # add the trailing slash
    }

    location /games/ {
        proxy_pass                 http://10.1.1.23:7172;               # doll-chan, Lumi Games
        proxy_http_version         1.1;
        proxy_set_header           Upgrade               $http_upgrade;         # websocket upgrade
        proxy_set_header           Connection            $connection_upgrade;   # "upgrade" or "close"
        proxy_set_header           Host                  $host;
        proxy_set_header           X-Forwarded-For       $proxy_add_x_forwarded_for;
        proxy_set_header           X-Forwarded-Proto     $scheme;
        proxy_set_header           X-Real-IP             $remote_addr;  # the bot trusts this only from WEB_TRUSTED_PROXY_IPS
        proxy_set_header           X-Forwarded-Host      $host;
        proxy_read_timeout         300s;                                # long-lived websockets
        proxy_send_timeout         300s;
        proxy_buffering            off;
    }

    # Lumi-Town (Lumi Pet + Lumi minigames, src/lumi/ inside the Lumi Games server on doll-chan :7172).
    location = /lumipet {
        return 301 /lumipet/;                                            # add the trailing slash
    }

    location ~ ^/lumipet/api/.+/stream$ {                                # live updates (SSE): town, parties, showdown tables
        proxy_pass                 http://10.1.1.23:7172;               # doll-chan, Lumi Games server
        proxy_http_version         1.1;
        proxy_set_header           Connection            "";            # keep-alive, no websocket upgrade
        proxy_set_header           Host                  $host;
        proxy_set_header           X-Forwarded-For       $proxy_add_x_forwarded_for;
        proxy_set_header           X-Forwarded-Proto     $scheme;
        proxy_set_header           X-Real-IP             $remote_addr;
        proxy_set_header           X-Forwarded-Host      $host;
        proxy_buffering            off;                                 # send each event as it happens
        proxy_cache                off;
        proxy_read_timeout         1h;                                  # streams stay open; the server pings every 15-25 s
    }

    location /lumipet/ {
        proxy_pass                 http://10.1.1.23:7172;               # doll-chan, Lumi Games server
        proxy_http_version         1.1;
        proxy_set_header           Host                  $host;
        proxy_set_header           X-Forwarded-For       $proxy_add_x_forwarded_for;
        proxy_set_header           X-Forwarded-Proto     $scheme;
        proxy_set_header           X-Real-IP             $remote_addr;  # the bot trusts this only from WEB_TRUSTED_PROXY_IPS
        proxy_set_header           X-Forwarded-Host      $host;
        client_max_body_size       1m;                                  # long Lumi-Soft / snake run logs
        proxy_read_timeout         60s;
        gzip                       on;                                  # game.js / house.js are big plain JS files
        gzip_types                 application/javascript text/javascript text/css application/json image/svg+xml;
    }

    # Main site/app.
    # Replace this with your real site upstream or static root if needed.
    location / {
        proxy_pass                 http://127.0.0.1:3000;
        proxy_http_version         1.1;
        proxy_set_header           Upgrade               $http_upgrade;
        proxy_set_header           Connection            $connection_upgrade;
        proxy_set_header           Host                  $host;
        proxy_set_header           X-Forwarded-For       $proxy_add_x_forwarded_for;
        proxy_set_header           X-Forwarded-Proto     $scheme;
        proxy_set_header           X-Real-IP             $remote_addr;
        proxy_set_header           X-Forwarded-Host      $host;
        proxy_connect_timeout      5s;
        proxy_send_timeout         30s;
        proxy_read_timeout         30s;
        proxy_buffering            off;
        proxy_hide_header          Server;
    }
}
