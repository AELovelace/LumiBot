# /etc/nginx/snippets/sadgirlcoin-api.conf
#
# Simple server-context reverse proxy for the SadGirlCoin API.
# Include from inside your `server { ... }` block:
#
#     include /etc/nginx/snippets/sadgirlcoin-api.conf;
#
# No extra upstream/map/limit files required.

location = /v1            { return 301 /v1/; }
location = /oauth         { return 301 /oauth/; }

location = /v1/healthz {
    proxy_pass         http://127.0.0.1:7788;
    proxy_http_version 1.1;
    proxy_set_header   Connection        "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Real-IP         $remote_addr;
    access_log         off;
}

location /auth/ {
    proxy_pass                 http://127.0.0.1:7777;
    proxy_http_version         1.1;
    proxy_set_header           Connection            "";
    proxy_set_header           Host                  $host;
    proxy_set_header           X-Forwarded-For       $proxy_add_x_forwarded_for;
    proxy_set_header           X-Forwarded-Proto     $scheme;
    proxy_set_header           X-Real-IP             $remote_addr;
    proxy_set_header           X-Forwarded-Host      $host;
    proxy_pass_request_headers on;
    proxy_intercept_errors     off;
    proxy_connect_timeout      5s;
    proxy_send_timeout         30s;
    proxy_read_timeout         30s;
    proxy_buffering            off;
    proxy_request_buffering    on;
    proxy_hide_header          Server;
    add_header                 Cache-Control "no-store" always;
}

location = /oauth/consent {
    client_max_body_size       16k;
    client_body_buffer_size    16k;

    proxy_pass                 http://127.0.0.1:7777;
    proxy_http_version         1.1;
    proxy_set_header           Connection            "";
    proxy_set_header           Host                  $host;
    proxy_set_header           X-Forwarded-For       $proxy_add_x_forwarded_for;
    proxy_set_header           X-Forwarded-Proto     $scheme;
    proxy_set_header           X-Real-IP             $remote_addr;
    proxy_set_header           X-Forwarded-Host      $host;
    proxy_pass_request_headers on;
    proxy_intercept_errors     off;
    proxy_connect_timeout      5s;
    proxy_send_timeout         30s;
    proxy_read_timeout         30s;
    proxy_buffering            off;
    proxy_request_buffering    on;
    proxy_hide_header          Server;
    add_header                 Cache-Control "no-store" always;
}

location /oauth/ {
    client_max_body_size       16k;
    client_body_buffer_size    16k;
    limit_req                  zone=sgc_oauth_ip burst=20 nodelay;

    proxy_pass                 http://127.0.0.1:7788;
    proxy_http_version         1.1;
    proxy_set_header           Connection            "";
    proxy_set_header           Host                  $host;
    proxy_set_header           X-Forwarded-For       $proxy_add_x_forwarded_for;
    proxy_set_header           X-Forwarded-Proto     $scheme;
    proxy_set_header           X-Real-IP             $remote_addr;
    proxy_set_header           X-Forwarded-Host      $host;

    proxy_pass_request_headers on;
    proxy_intercept_errors     off;

    proxy_connect_timeout      5s;
    proxy_send_timeout         30s;
    proxy_read_timeout         30s;

    proxy_buffering            off;
    proxy_request_buffering    on;

    proxy_hide_header          Server;
    add_header                 Cache-Control "no-store" always;
}

location /v1/ {
    client_max_body_size       16k;
    client_body_buffer_size    16k;

    proxy_pass                 http://127.0.0.1:7788;
    proxy_http_version         1.1;
    proxy_set_header           Connection            "";
    proxy_set_header           Host                  $host;
    proxy_set_header           X-Forwarded-For       $proxy_add_x_forwarded_for;
    proxy_set_header           X-Forwarded-Proto     $scheme;
    proxy_set_header           X-Real-IP             $remote_addr;
    proxy_set_header           X-Forwarded-Host      $host;

    proxy_pass_request_headers on;
    proxy_intercept_errors     off;

    proxy_connect_timeout      5s;
    proxy_send_timeout         30s;
    proxy_read_timeout         30s;

    proxy_buffering            off;
    proxy_request_buffering    on;

    proxy_hide_header          Server;
}
